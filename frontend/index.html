<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SQL Agent</title>
  <style>
    /* ── Reset ────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f0f2f5;
      --surface:    #ffffff;
      --border:     #d9dee6;
      --accent:     #ea580c;
      --accent-h:   #c2410c;
      --text:       #1e293b;
      --muted:      #64748b;
      --code-bg:    #0f172a;
      --code-text:  #e2e8f0;
      --success:    #16a34a;
      --error:      #dc2626;
      --radius:     10px;
      --shadow:     0 2px 12px rgba(0,0,0,.08);

      /* node accent colours */
      --c-list:     #6366f1;
      --c-schema:   #8b5cf6;
      --c-analysis: #d97706;
      --c-generate: #ea580c;
      --c-check:    #0891b2;
      --c-run:      #0d9488;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #eef1f5;
      color: var(--text);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 0 0 64px 0;
    }

    /* ── Top banner ───────────────────────────────────────────────────────── */
    .top-banner {
      width: 100%; background: #003f6b;
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .top-banner-left  { display: flex; align-items: center; gap: 14px; }
    .top-banner-brand { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: .04em; text-transform: uppercase; }
    .top-banner-divider { width: 1px; height: 18px; background: rgba(255,255,255,.25); }
    .top-banner-product { font-size: 12px; color: rgba(255,255,255,.7); letter-spacing: .02em; }

    .page-wrap { width: 100%; max-width: 960px; padding: 28px 16px 0; }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      width: 100%; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 44px; height: 44px; background: var(--accent);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 22px;
      box-shadow: 0 2px 8px rgba(234,88,12,.35);
    }
    .logo-text h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
    .logo-text p  { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* ── Card ─────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      width: 100%; padding: 28px;
    }

    /* ── Form ─────────────────────────────────────────────────────────────── */
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

    /* ── Question + limit row ─────────────────────────────────────────────── */
    .question-row { display: flex; gap: 10px; align-items: flex-start; }

    textarea {
      flex: 1; min-height: 80px; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 15px; font-family: inherit; resize: vertical;
      outline: none; transition: border-color .15s; line-height: 1.5;
    }
    textarea:focus { border-color: var(--accent); }

    /* Row-limit control */
    .limit-wrap {
      display: flex; flex-direction: column; gap: 4px; min-width: 90px;
    }
    .limit-label {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .limit-input {
      width: 90px; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; font-family: inherit;
      outline: none; transition: border-color .15s; text-align: center;
    }
    .limit-input:focus { border-color: var(--accent); }

    .form-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 12px; gap: 12px; flex-wrap: wrap;
    }
    .examples { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
    .example-btn {
      font-size: 12px; padding: 4px 10px;
      border: 1px solid var(--border); background: var(--bg);
      border-radius: 20px; cursor: pointer; color: var(--muted);
      transition: all .15s; white-space: nowrap;
    }
    .example-btn:hover { border-color: var(--accent); color: var(--accent); background: #eff6ff; }
    button[type="submit"] {
      padding: 10px 24px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background .15s; white-space: nowrap;
      letter-spacing: .03em; text-transform: uppercase;
    }
    button[type="submit"]:hover    { background: var(--accent-h); }
    button[type="submit"]:disabled { background: var(--muted); cursor: not-allowed; }
    hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ── Spinner ──────────────────────────────────────────────────────────── */
    .spinner-wrap {
      display: none; align-items: center; gap: 12px;
      color: var(--muted); font-size: 14px; margin: 12px 0 4px;
    }
    .spinner-wrap.visible { display: flex; }
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Result ───────────────────────────────────────────────────────────── */
    #result { display: none; }
    #result.visible { display: block; }

    /* ── Answer box ───────────────────────────────────────────────────────── */
    .answer-box {
      border: 1px solid #bbf7d0; border-radius: 8px; overflow: visible;
    }
    .answer-box.error { border-color: #fecaca; }
    .answer-header {
      background: #dcfce7; padding: 10px 16px;
      display: flex; align-items: center; gap: 8px;
      border-radius: 8px 8px 0 0;
    }
    .answer-box.error .answer-header { background: #fee2e2; }
    .answer-header-label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--success);
    }
    .answer-box.error .answer-header-label { color: var(--error); }
    .answer-body { padding: 16px 20px; background: #f0fdf4; border-radius: 0 0 8px 8px; overflow: visible; }
    .answer-box.error .answer-body { background: #fef2f2; }

    .answer-text { font-size: 15px; line-height: 1.75; color: var(--text); }
    .answer-text strong { font-weight: 700; }
    .answer-text em     { font-style: italic; }
    .answer-text code {
      background: #d1fae5; color: #065f46;
      padding: 1px 6px; border-radius: 4px;
      font-family: "Fira Code","Cascadia Code","Consolas", monospace; font-size: 13px;
    }
    .answer-text pre {
      background: var(--code-bg); color: var(--code-text);
      padding: 14px 16px; border-radius: 8px; overflow-x: auto;
      font-family: "Fira Code","Cascadia Code","Consolas", monospace;
      font-size: 13px; line-height: 1.7; margin: 12px 0;
    }
    .answer-text pre code { background: transparent; color: inherit; padding: 0; border-radius: 0; font-size: inherit; }

    /* ── Data Table ───────────────────────────────────────────────────────── */
    .data-table-section {
      margin-top: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;        /* clip at rounded corners; scroll is on .data-table-scroll */
    }
    .data-table-header {
      background: #1e293b;
      padding: 9px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border-radius: 8px 8px 0 0;
    }
    .data-table-header .tbl-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #94a3b8;
    }
    .data-table-header .tbl-meta {
      display: flex; align-items: center; gap: 8px;
    }
    .row-count-badge {
      font-size: 11px; font-weight: 700; padding: 2px 9px;
      border-radius: 20px; background: rgba(255,255,255,.1);
      color: #a3e635; border: 1px solid rgba(163,230,53,.3);
    }
    .col-count-badge {
      font-size: 11px; font-weight: 700; padding: 2px 9px;
      border-radius: 20px; background: rgba(255,255,255,.08);
      color: #94a3b8; border: 1px solid rgba(148,163,184,.25);
    }
    .tbl-hint {
      font-size: 10px; color: #64748b; white-space: nowrap;
    }

    .data-table-scroll {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 420px;
      -webkit-overflow-scrolling: touch;
    }

    .data-table {
      width: max-content;      /* grows as wide as content demands */
      min-width: 100%;         /* still fills container when columns are few */
      border-collapse: collapse;
      font-size: 13px;
      background: var(--surface);
      table-layout: auto;
    }

    .data-table thead {
      position: sticky; top: 0; z-index: 2;
    }

    .data-table th {
      background: #f1f5f9;
      padding: 9px 12px;
      text-align: center;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted);
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: background .12s, color .12s;
    }
    .data-table th:hover { background: #e2e8f0; color: var(--accent); }
    .data-table th.sort-asc  { color: var(--accent); }
    .data-table th.sort-desc { color: var(--accent); }

    /* sort arrow appended via ::after */
    .data-table th::after { content: ""; margin-left: 4px; opacity: .4; font-size: 10px; }
    .data-table th.sort-asc::after  { content: "▲"; opacity: 1; }
    .data-table th.sort-desc::after { content: "▼"; opacity: 1; }

    .data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text);
      white-space: nowrap;     /* keep each cell on one line → table widens → scroll appears */
      text-align: center;
    }
    /* Numeric cells — centered to match headers */
    .data-table td.num,
    .data-table th.num { text-align: center; font-variant-numeric: tabular-nums; }

    .data-table tbody tr:nth-child(even) td { background: #f8fafc; }
    .data-table tbody tr:hover td { background: #eff6ff; }

    /* NULL / empty values */
    .data-table td.null-cell { color: #94a3b8; font-style: italic; }

    /* SQL query box */
    .sql-box {
      margin-top: 14px; border: 1px solid #334155;
      border-radius: 8px; overflow: hidden;
    }
    .sql-box-header {
      background: #1e293b; padding: 8px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sql-box-header .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; }
    .sql-box-header .lang { font-size: 11px; color: #4ade80; }
    .sql-box pre {
      background: var(--code-bg); color: var(--code-text); margin: 0;
      padding: 14px 16px; overflow-x: auto;
      font-family: "Fira Code","Cascadia Code","Consolas", monospace;
      font-size: 13px; line-height: 1.7;
    }
    .sql-box pre code { background: transparent; color: inherit; padding: 0; }

    /* Tables-used chips */
    .tables-used {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-top: 12px; padding-top: 12px; border-top: 1px solid #bbf7d0;
    }
    .tables-used-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .table-chip { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }

    /* ── Trace ────────────────────────────────────────────────────────────── */
    .trace-toggle {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted); cursor: pointer;
      margin-top: 20px; user-select: none; padding: 4px 0; width: fit-content;
    }
    .trace-toggle:hover { color: var(--accent); }
    .trace-arrow { font-size: 10px; transition: transform .2s; display: inline-block; }
    .trace-toggle.open .trace-arrow { transform: rotate(90deg); }
    .trace-body { display: none; margin-top: 12px; }
    .trace-body.open { display: block; }

    /* Timeline */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before {
      content: ""; position: absolute;
      left: 9px; top: 0; bottom: 0;
      width: 2px; background: var(--border);
    }
    .tl-item { position: relative; margin-bottom: 14px; }
    .tl-item:last-child { margin-bottom: 0; }
    .tl-dot {
      position: absolute; left: -24px; top: 12px;
      width: 12px; height: 12px; border-radius: 50%;
      border: 2px solid #fff; z-index: 1;
    }
    .tl-item[data-node="list_tables"]     .tl-dot { background: var(--c-list);     box-shadow: 0 0 0 2px #c7d2fe; }
    .tl-item[data-node="call_get_schema"] .tl-dot { background: var(--c-schema);   box-shadow: 0 0 0 2px #ddd6fe; }
    .tl-item[data-node="get_schema"]      .tl-dot { background: var(--c-schema);   box-shadow: 0 0 0 2px #ddd6fe; }
    .tl-item[data-node="schema_analysis"] .tl-dot { background: var(--c-analysis); box-shadow: 0 0 0 2px #fde68a; }
    .tl-item[data-node="generate_query"]  .tl-dot { background: var(--c-generate); box-shadow: 0 0 0 2px #fed7aa; }
    .tl-item[data-node="check_query"]     .tl-dot { background: var(--c-check);    box-shadow: 0 0 0 2px #a5f3fc; }
    .tl-item[data-node="run_query"]       .tl-dot { background: var(--c-run);      box-shadow: 0 0 0 2px #99f6e4; }

    .node-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .node-card-header {
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .tl-item[data-node="list_tables"]     .node-card-header { background: #eef2ff; }
    .tl-item[data-node="call_get_schema"] .node-card-header { background: #f5f3ff; }
    .tl-item[data-node="get_schema"]      .node-card-header { background: #faf5ff; }
    .tl-item[data-node="schema_analysis"] .node-card-header { background: #fffbeb; }
    .tl-item[data-node="generate_query"]  .node-card-header { background: #fff7ed; }
    .tl-item[data-node="check_query"]     .node-card-header { background: #ecfeff; }
    .tl-item[data-node="run_query"]       .node-card-header { background: #f0fdfa; }

    .node-icon  { font-size: 15px; line-height: 1; }
    .node-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; flex: 1; }
    .tl-item[data-node="list_tables"]     .node-label { color: var(--c-list); }
    .tl-item[data-node="call_get_schema"] .node-label { color: var(--c-schema); }
    .tl-item[data-node="get_schema"]      .node-label { color: var(--c-schema); }
    .tl-item[data-node="schema_analysis"] .node-label { color: var(--c-analysis); }
    .tl-item[data-node="generate_query"]  .node-label { color: var(--c-generate); }
    .tl-item[data-node="check_query"]     .node-label { color: var(--c-check); }
    .tl-item[data-node="run_query"]       .node-label { color: var(--c-run); }

    .node-iter { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; background: #e2e8f0; color: var(--muted); }
    .node-card-body { padding: 12px 14px; font-size: 13px; line-height: 1.6; background: var(--surface); }
    .node-summary { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .node-text    { color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .node-text.muted { color: var(--muted); font-size: 12px; }
    .pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; white-space: nowrap; }
    .pill-table   { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }
    .pill-result  { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
    .pill-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .pill-count   { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
    .node-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; margin-bottom: 8px; }
    .badge-complete { background: #dcfce7; color: #166534; }
    .badge-more     { background: #fef3c7; color: #92400e; }
    .badge-valid    { background: #cffafe; color: #164e63; }
    .badge-modified { background: #fef3c7; color: #92400e; }
    .reasoning-text { font-size: 12px; color: var(--muted); margin-top: 6px; background: var(--bg); padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--border); max-height: 90px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .node-sql-wrap { border: 1px solid #334155; border-radius: 6px; overflow: hidden; margin-top: 6px; }
    .node-sql-header { background: #1e293b; padding: 5px 12px; display: flex; align-items: center; justify-content: space-between; }
    .node-sql-header .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; }
    .node-sql-header .status { font-size: 10px; color: #64748b; }
    .node-sql-wrap pre { background: var(--code-bg); color: var(--code-text); margin: 0; padding: 10px 12px; overflow-x: auto; max-height: 280px; font-family: "Fira Code","Cascadia Code","Consolas", monospace; font-size: 12px; line-height: 1.65; }
    .node-sql-wrap pre code { background: transparent; color: inherit; padding: 0; }
    .node-result-wrap { background: #0f172a; color: #a3e635; border-radius: 6px; padding: 10px 12px; margin-top: 6px; overflow-x: auto; font-family: "Fira Code","Cascadia Code","Consolas", monospace; font-size: 12px; line-height: 1.6; white-space: pre; }
    .schema-toggle { font-size: 11px; color: var(--muted); cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 4px; user-select: none; }
    .schema-toggle:hover { color: var(--accent); }
    .schema-detail { display: none; margin-top: 6px; }
    .schema-detail.open { display: block; }
    .schema-detail pre { background: #0f172a; color: #94a3b8; padding: 8px 10px; border-radius: 6px; overflow-x: auto; font-size: 11px; line-height: 1.5; max-height: 150px; }
    .schema-detail pre code { background: transparent; color: inherit; padding: 0; }
  </style>
</head>
<body>

  <!-- ── Top banner ───────────────────────────────────────────────────── -->
  <div class="top-banner">
    <div class="top-banner-left">
      <span class="top-banner-brand">AI Data Platform</span>
      <div class="top-banner-divider"></div>
      <span class="top-banner-product">SQL Agent</span>
    </div>
  </div>

  <div class="page-wrap">

    <header>
      <div class="logo">
        <div class="logo-icon">&#128200;</div>
        <div class="logo-text">
          <h1>SQL Agent</h1>
          <p>Natural language queries</p>
        </div>
      </div>
    </header>

    <div class="card">
      <label for="question" class="form-label">Ask a business question</label>

      <!-- ── Question textarea + row-limit input side by side ──────────── -->
      <div class="question-row">
        <textarea id="question" placeholder="e.g. What were total sales by item category last year?"></textarea>
      </div>

      <div class="form-footer">
        <div class="examples">
          <span class="example-btn">Total sales by item category</span>
          <span class="example-btn">Written sales by region Jan 2019</span>
          <span class="example-btn">Top 10 customers by purchase amount</span>
          <span class="example-btn">Appointments by campaign Jan 2026</span>
          <span class="example-btn">Monthly sales trend over the last year</span>
        </div>
        <button type="submit" id="ask-btn">Run Query</button>
      </div>

      <div class="spinner-wrap" id="spinner">
        <div class="spinner"></div>
        <span id="spinner-text">Running query...</span>
      </div>

      <div id="result">
        <hr />

        <!-- ── Answer box ─────────────────────────────────────────────── -->
        <div class="answer-box" id="answer-box">
          <div class="answer-header">
            <span class="answer-header-label" id="answer-label">Answer</span>
          </div>
          <div class="answer-body">
            <!-- 1. Natural-language prose answer -->
            <div class="answer-text" id="answer-text"></div>

            <!-- 2. Data table (NEW) — injected here by renderTable() -->
            <div id="table-section"></div>

            <!-- 3. SQL query used -->
            <div id="sql-section"></div>

            <!-- 4. Tables chip list -->
            <div id="tables-section"></div>
          </div>
        </div>

        <!-- ── Trace ──────────────────────────────────────────────────── -->
        <div class="trace-toggle" id="trace-toggle">
          <span class="trace-arrow">&#9654;</span>
          <span id="trace-label">Show execution trace</span>
        </div>
        <div class="trace-body" id="trace-body">
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
    </div>

  </div><!-- /.page-wrap -->

  <script>
    /* ── DOM refs ────────────────────────────────────────────────────── */
    const qEl           = document.getElementById("question");
    const askBtn        = document.getElementById("ask-btn");
    const spinnerEl     = document.getElementById("spinner");
    const spinnerText   = document.getElementById("spinner-text");
    const resultEl      = document.getElementById("result");
    const answerBox     = document.getElementById("answer-box");
    const answerLabel   = document.getElementById("answer-label");
    const answerText    = document.getElementById("answer-text");
    const tableSection  = document.getElementById("table-section");
    const sqlSection    = document.getElementById("sql-section");
    const tablesSection = document.getElementById("tables-section");
    const traceToggle   = document.getElementById("trace-toggle");
    const traceBody     = document.getElementById("trace-body");
    const traceLabel    = document.getElementById("trace-label");
    const timeline      = document.getElementById("timeline");

    /* ── Utilities ───────────────────────────────────────────────────── */
    function esc(s) {
      return String(s ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function md(text) {
      const blocks = [];
      let s = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, _lang, code) => {
        const i = blocks.length;
        blocks.push(`<pre><code>${esc(code.trim())}</code></pre>`);
        return `\x00B${i}\x00`;
      });
      s = s
        .replace(/`([^`\n]+)`/g, (_, c) => `<code>${esc(c)}</code>`)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g,   "<em>$1</em>")
        .replace(/\n/g, "<br>");
      return s.replace(/\x00B(\d+)\x00/g, (_, i) => blocks[+i]);
    }

    function splitAnswer(raw) {
      let mainText = raw, sql = null, tables = null;
      const sqlIdx = raw.indexOf("**SQL Query Used:**");
      if (sqlIdx !== -1) {
        mainText = raw.substring(0, sqlIdx).trim();
        const tail  = raw.substring(sqlIdx);
        const codeM = tail.match(/```(?:sql)?\n?([\s\S]*?)```/);
        if (codeM) sql = codeM[1].trim();
        const tblM  = tail.match(/\*\*Tables Used:\*\*\s*([^\n]+)/);
        if (tblM) tables = tblM[1].trim();
      }
      return { mainText, sql, tables };
    }

    /* ── Detect if a cell value looks numeric ────────────────────────── */
    function isNumeric(v) {
      if (v === null || v === undefined || v === "") return false;
      return !isNaN(parseFloat(String(v))) && isFinite(String(v));
    }

    /* ── Format a cell value for display ─────────────────────────────── */
    function fmtCell(v) {
      if (v === null || v === undefined || v === "") return null; // signals null styling
      // Round long decimals to 4 places for readability
      if (typeof v === "number" && !Number.isInteger(v)) {
        return parseFloat(v.toFixed(4)).toLocaleString();
      }
      return String(v);
    }

    /* ── Table renderer ──────────────────────────────────────────────── */
    /*
     * tableData = { columns: ["Col1", "Col2", ...], rows: [[v, v, ...], ...] }
     * Renders a sticky-header, horizontally scrollable, sortable HTML table.
     * Numeric columns are right-aligned and bold.
     */
    function renderTable(tableData) {
      tableSection.innerHTML = "";
      if (!tableData || !tableData.columns || !tableData.rows) return;

      const { columns, rows } = tableData;

      // Single-row (or zero-row) results: the natural-language answer is
      // sufficient — no table needed.
      if (rows.length <= 1) return;

      // Detect which columns are numeric by sampling first 10 rows
      const numericCol = columns.map((_, ci) =>
        rows.slice(0, 10).some(r => isNumeric(r[ci]))
      );

      // Sort state: { col: index, dir: "asc"|"desc" }
      let sortState = { col: -1, dir: "asc" };
      let displayRows = [...rows];

      // ── Build wrapper ──────────────────────────────────────────────────
      const section = document.createElement("div");
      section.className = "data-table-section";

      section.innerHTML = `
        <div class="data-table-header">
          <span class="tbl-title">&#128202; Query Results</span>
          <div class="tbl-meta">
            <span class="row-count-badge" id="tbl-row-badge">${rows.length} row${rows.length !== 1 ? "s" : ""}</span>
            <span class="col-count-badge">${columns.length} col${columns.length !== 1 ? "s" : ""}</span>
            <span class="tbl-hint">Click column header to sort</span>
          </div>
        </div>
        <div class="data-table-scroll">
          <table class="data-table" id="data-tbl">
            <thead>
              <tr>
                ${columns.map((c, i) =>
                  `<th data-col="${i}" class="${numericCol[i] ? "num" : ""}">${esc(c)}</th>`
                ).join("")}
              </tr>
            </thead>
            <tbody id="tbl-body"></tbody>
          </table>
        </div>`;

      tableSection.appendChild(section);

      const tbody      = section.querySelector("#tbl-body");
      const headers    = section.querySelectorAll(".data-table th");
      const rowBadge   = section.querySelector("#tbl-row-badge");

      // ── Render rows ────────────────────────────────────────────────────
      function renderRows() {
        tbody.innerHTML = displayRows.map(row => {
          const cells = columns.map((_, ci) => {
            const raw      = row[ci];
            const display  = fmtCell(raw);
            const isNull   = display === null;
            const numClass = numericCol[ci] ? " num" : "";
            const nullClass = isNull ? " null-cell" : "";
            return `<td class="${numClass}${nullClass}" title="${esc(raw)}">${
              isNull ? "<em>null</em>" : esc(display)
            }</td>`;
          }).join("");
          return `<tr>${cells}</tr>`;
        }).join("");
        rowBadge.textContent = `${displayRows.length} row${displayRows.length !== 1 ? "s" : ""}`;
      }

      // ── Sort handler ───────────────────────────────────────────────────
      headers.forEach(th => {
        th.addEventListener("click", () => {
          const ci = parseInt(th.dataset.col, 10);

          if (sortState.col === ci) {
            sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
          } else {
            sortState = { col: ci, dir: "asc" };
          }

          // Update header classes
          headers.forEach(h => h.classList.remove("sort-asc", "sort-desc"));
          th.classList.add(sortState.dir === "asc" ? "sort-asc" : "sort-desc");

          displayRows.sort((a, b) => {
            const av = a[ci], bv = b[ci];
            // nulls last
            if (av === null || av === undefined) return 1;
            if (bv === null || bv === undefined) return -1;

            const an = parseFloat(av), bn = parseFloat(bv);
            let cmp;
            if (!isNaN(an) && !isNaN(bn)) {
              cmp = an - bn;
            } else {
              cmp = String(av).localeCompare(String(bv));
            }
            return sortState.dir === "asc" ? cmp : -cmp;
          });

          renderRows();
        });
      });

      renderRows();
    }

    /* ── Node inference ──────────────────────────────────────────────── */
    function inferNode(msg, idx, all) {
      const role = msg.role;
      const c    = msg.content || "";
      const tc   = msg.tool_calls;

      if (role === "human") return "question";
      if (role === "tool")
        return c.includes("CREATE TABLE") ? "get_schema" : "run_query";

      if (role === "ai") {
        if (/^Available tables:/i.test(c))    return "list_tables";
        if (c.includes("[Schema Analysis]"))  return "schema_analysis";
        if (tc && tc.some(t => t.name === "sql_db_schema")) return "call_get_schema";
        if (tc && tc.some(t => t.name === "sql_db_query")) {
          for (let i = idx - 1; i >= 0; i--) {
            const m = all[i];
            if (m.role === "tool" && !m.content?.includes("CREATE TABLE")) break;
            if (m.role === "ai" && m.tool_calls?.some(t => t.name === "sql_db_query"))
              return "check_query";
          }
          return "generate_query";
        }
        return "final_answer";
      }
      return "unknown";
    }

    const NODE_META = {
      list_tables:     { icon: "&#128193;",  label: "List Tables",     iter: false },
      call_get_schema: { icon: "&#128203;",  label: "Schema Fetch",    iter: true  },
      get_schema:      { icon: "&#128196;",  label: "Schema Result",   iter: true  },
      schema_analysis: { icon: "&#129504;",  label: "Schema Analysis", iter: true  },
      generate_query:  { icon: "&#9881;",    label: "Generate Query",  iter: false },
      check_query:     { icon: "&#10003;",   label: "Validate Query",  iter: false },
      run_query:       { icon: "&#9654;",    label: "Execute Query",   iter: false },
    };

    function nodeBody(nodeId, msg, ctx) {
      const c  = msg.content || "";
      const tc = msg.tool_calls;
      switch (nodeId) {
        case "list_tables": {
          const raw    = c.replace(/^Available tables:\s*/i, "").trim();
          const tables = raw.split(",").map(t => t.trim()).filter(Boolean);
          return `<div class="node-summary">Found <strong>${tables.length}</strong> tables</div>
                  <div class="pills">${tables.map(t => `<span class="pill pill-count">${esc(t)}</span>`).join("")}</div>`;
        }
        case "call_get_schema": {
          const names  = tc?.[0]?.args?.table_names || "";
          const tables = names.split(",").map(t => t.trim()).filter(Boolean);
          return `<div class="node-summary">Requested schema for <strong>${tables.length}</strong> table(s)</div>
                  <div class="pills">${tables.map(t => `<span class="pill pill-table">${esc(t)}</span>`).join("")}</div>`;
        }
        case "get_schema": {
          const ms     = [...c.matchAll(/CREATE TABLE\s+"?(\S+?)"?\s*\(/gi)];
          const tables = [...new Set(ms.map(m => m[1]))];
          const uid    = "sd_" + Math.random().toString(36).slice(2);
          return `<div class="node-summary">Retrieved <strong>${tables.length}</strong> schema(s)</div>
                  <div class="pills">${tables.map(t => `<span class="pill pill-result">${esc(t)}</span>`).join("")}</div>
                  <div class="schema-toggle" onclick="var el=document.getElementById('${uid}');el.classList.toggle('open');this.innerHTML=(el.classList.contains('open')?'&#9660;':'&#9654;')+' raw schema';">&#9654; raw schema</div>
                  <div class="schema-detail" id="${uid}"><pre><code>${esc(c.trim())}</code></pre></div>`;
        }
        case "schema_analysis": {
          const decM   = c.match(/Decision:\s*([\w_]+)/);
          const resM   = c.match(/Reasoning:\s*([\s\S]+?)(?=\.\s*Tables still needed:|\.?\s*$)/);
          const needM  = c.match(/Tables still needed:\s*\[([\s\S]*?)\]/);
          const decision = decM ? decM[1] : "UNKNOWN";
          const reason   = resM ? resM[1].trim() : "";
          const needed   = needM ? needM[1].split(",").map(t => t.trim().replace(/['"]/g,"")).filter(Boolean) : [];
          const complete = decision === "ANALYSIS_COMPLETE";
          let html = complete
            ? `<span class="node-badge badge-complete">&#10003; ANALYSIS COMPLETE</span>`
            : `<span class="node-badge badge-more">&#8635; NEED MORE SCHEMAS</span>`;
          if (reason)  html += `<div class="reasoning-text">${esc(reason)}</div>`;
          if (needed.length) html += `<div class="node-summary" style="margin-top:8px">Still needed:</div><div class="pills">${needed.map(t => `<span class="pill pill-warning">${esc(t)}</span>`).join("")}</div>`;
          return html;
        }
        case "generate_query": {
          const query = tc?.[0]?.args?.query || "";
          if (!query) return `<div class="node-text muted">No SQL produced</div>`;
          ctx.lastSQL = query;
          return sqlWrap(query, "GENERATED SQL", "");
        }
        case "check_query": {
          const query   = tc?.[0]?.args?.query || "";
          const changed = ctx.lastSQL && query.trim() !== ctx.lastSQL.trim();
          const badge   = changed
            ? `<span class="node-badge badge-modified">&#9998; Query modified by validator</span>`
            : `<span class="node-badge badge-valid">&#10003; Passed validation unchanged</span>`;
          return badge + sqlWrap(query, "VALIDATED SQL", changed ? "MODIFIED" : "UNCHANGED");
        }
        case "run_query": {
          return `<div class="node-summary">Execution result</div>
                  <div class="node-result-wrap">${esc(c.trim())}</div>`;
        }
        default:
          return `<div class="node-text muted">${esc(c.substring(0, 300))}</div>`;
      }
    }

    function sqlWrap(sql, label, status) {
      return `<div class="node-sql-wrap">
                <div class="node-sql-header">
                  <span class="lbl">${label}</span>
                  ${status ? `<span class="status">${status}</span>` : ""}
                </div>
                <pre><code>${esc(sql)}</code></pre>
              </div>`;
    }

    function buildTimeline(messages) {
      timeline.innerHTML = "";
      const iterCount = {}, ctx = { lastSQL: "" };
      let count = 0;
      messages.forEach((msg, i) => {
        const nodeId = inferNode(msg, i, messages);
        if (nodeId === "question" || nodeId === "final_answer" || nodeId === "unknown") return;
        const meta = NODE_META[nodeId];
        if (!meta) return;
        count++;
        if (meta.iter) iterCount[nodeId] = (iterCount[nodeId] || 0) + 1;
        const iter      = meta.iter ? iterCount[nodeId] : null;
        const body      = nodeBody(nodeId, msg, ctx);
        const iterBadge = iter ? `<span class="node-iter">#${iter}</span>` : "";
        const item = document.createElement("div");
        item.className   = "tl-item";
        item.dataset.node = nodeId;
        item.innerHTML = `
          <div class="tl-dot"></div>
          <div class="node-card">
            <div class="node-card-header">
              <span class="node-icon">${meta.icon}</span>
              <span class="node-label">${meta.label}</span>
              ${iterBadge}
            </div>
            <div class="node-card-body">${body}</div>
          </div>`;
        timeline.appendChild(item);
      });
      return count;
    }

    /* ── Event listeners ─────────────────────────────────────────────── */
    document.querySelectorAll(".example-btn").forEach(btn =>
      btn.addEventListener("click", () => { qEl.value = btn.textContent.trim(); qEl.focus(); })
    );
    traceToggle.addEventListener("click", () => {
      traceToggle.classList.toggle("open");
      traceBody.classList.toggle("open");
    });
    askBtn.addEventListener("click", runQuery);
    qEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) runQuery();
    });

    /* ── Main handler ────────────────────────────────────────────────── */
    async function runQuery() {
      const question = qEl.value.trim();
      if (!question) { qEl.focus(); return; }

      // Read row_limit from the input; clamp to [1, 1000]

      askBtn.disabled = true;
      resultEl.classList.remove("visible");
      traceBody.classList.remove("open");
      traceToggle.classList.remove("open");
      spinnerEl.classList.add("visible");
      spinnerText.textContent = "Running agent...";

      try {
        const res = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question}),   // ← send row_limit
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ detail: res.statusText }));
          throw new Error(err.detail || res.statusText);
        }

        const data = await res.json();

        /* ── Natural-language answer ────────────────────────────────── */
        const { mainText, sql, tables } = splitAnswer(data.final_answer || "(no answer)");
        answerBox.classList.remove("error");
        answerLabel.textContent = "Answer";
        answerText.innerHTML = md(mainText);

        /* ── Data table (NEW) ───────────────────────────────────────── */
        renderTable(data.table_data);   // null-safe — renders nothing if no data

        /* ── SQL box ────────────────────────────────────────────────── */
        sqlSection.innerHTML = sql
          ? `<div class="sql-box">
               <div class="sql-box-header">
                 <span class="lbl">SQL Query Used</span>
                 <span class="lang">sql</span>
               </div>
               <pre><code>${esc(sql)}</code></pre>
             </div>`
          : "";

        /* ── Tables-used chips ──────────────────────────────────────── */
        tablesSection.innerHTML = tables
          ? `<div class="tables-used">
               <span class="tables-used-label">Tables used:</span>
               ${tables.split(",").map(t => `<span class="table-chip">${esc(t.trim())}</span>`).join("")}
             </div>`
          : "";

        /* ── Trace ──────────────────────────────────────────────────── */
        const n = buildTimeline(data.messages || []);
        traceLabel.textContent = `Show agent trace (${n} steps)`;
        resultEl.classList.add("visible");

      // } catch (err) {
      //   answerBox.classList.add("error");
      //   answerLabel.textContent = "Error";
      //   answerText.textContent  = err.message;
      //   tableSection.innerHTML  = "";
      //   sqlSection.innerHTML    = "";
      //   tablesSection.innerHTML = "";
      //   resultEl.classList.add("visible");
      // }
      } catch (err) {
        // Log full error to browser console (visible only to developers, not end users)
        console.error("[SQL Agent] Query error:", err);

        answerBox.classList.add("error");
        answerLabel.textContent = "Error";

        // Show the sanitized server message if it looks safe,
        // otherwise show a generic fallback.
        const safeMessage = (err.message && err.message.length < 300 && !err.message.includes("Traceback"))
          ? err.message
          : "An unexpected error occurred. Please try again.";
        answerText.textContent  = safeMessage;

        tableSection.innerHTML  = "";
        sqlSection.innerHTML    = "";
        tablesSection.innerHTML = "";
        resultEl.classList.add("visible");
      }

      spinnerEl.classList.remove("visible");
      askBtn.disabled = false;
    }
  </script>

</body>
</html>
